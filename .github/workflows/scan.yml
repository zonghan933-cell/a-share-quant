name: A股量化扫描

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 获取仓库代码
        uses: actions/checkout@v6

      - name: 配置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 执行 A 股量化扫描
        run: python scan.py

      - name: 检查扫描结果
        run: |
          echo "===== latest.json ====="
          cat latest.json

      - name: 保存最新结果到仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json

          if git diff --cached --quiet; then
            echo "数据没有变化，无需提交"
          else
            git commit -m "Update A-share quant scan"
            git push
          fi
