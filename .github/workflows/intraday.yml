name: A股盘中 Shadow 扫描

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  intraday:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 获取仓库代码
        uses: actions/checkout@v6

      - name: 配置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 执行盘中 Shadow 扫描
        run: python scan.py

      - name: 显示盘中扫描结果
        run: |
          echo "===== INTRADAY SHADOW / latest.json ====="
          cat latest.json
